<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css"
        media="(prefers-color-scheme: light)">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
        media="(prefers-color-scheme: dark)">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>


    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script type="module" src="static/scripts/chat/chat.js?v=0.9.2.8"></script>
    <script type="module" src="static/scripts/ui/auto-fonts.js?v=0.9.2.8"></script>
    <script type="module" src="static/scripts/share.js?v=0.9.2.8"></script>
    <link rel="stylesheet" href="static/css/chat.css?v=0.9.2.8">
    <link rel="stylesheet" href="static/css/call.css?v=0.9.2.8">
</head>

<body>
    <main>
        <header>
            <nav>
                <h4 id="chat-title"></h4>
                <aside id="call-panel" class="minimized" hidden>
                    <header>
                        <nav>
                            <h4 id="call-mute-header" class="iconoir-microphone"></h4>
                            <h4 id="call-time">00:00</h4>
                            <button id="call-enlarge"><span class="iconoir-enlarge"></span></button>
                        </nav>
                    </header>
                    <div id="call-peers"></div>
                    <footer>
                        <button id="call-mute" class="iconoir-microphone" title="Микрофон"></button>
                        <button id="call-leave" class="iconoir-phone-disabled" title="Завершить"></button>
                    </footer>
                </aside>
                <div id="call-audio" hidden></div>
                <nav>
                    <button id="login-call" class="iconoir-phone"></button>
                    <button class="iconoir-menu" menu="chat-menu"></button>
                </nav>
            </nav>
        </header>
        <section id="message">
            <div id="users-none" hidden>
                <h3>В чате никого нет</h3>
                <nav>
                    <button><a href="/" class="iconoir-nav-arrow-left"></a></button>
                    <button id="share" type="button" class="iconoir-share-android">Пригласить</button>
                </nav>
            </div>
            <div id="users-list" hidden>
            </div>
            <p id="message-text"></p>
        </section>
        <div id="textarea">
            <nav class="input-area">
                <textarea rows="1" placeholder="Сообщение" inputmode="text"></textarea>
                <button id="reset" class="ghost">
                    <span class="iconoir-xmark"></span>
                </button>
            </nav>
        </div>
    </main>
</body>

</html>
