<head>
    <title>lime</title>

    <script src="static/scripts/login-chat.js?v=0.9.2.7.1"></script>
    <script src="static/scripts/install-app.js?v=0.9.2.7.1" defer></script>
    <script type="module" src="static/scripts/user/select-kaomoji.js?v=0.9.2.7.1" defer></script>
    <script type="module" src="static/scripts/ui/logos.js?v=0.9.2.7.1" defer></script>
    <script type="module" src="static/scripts/ui/version.js?v=0.9.2.7.1"></script>
    <script type="module" src="static/scripts/ui/nat.js?v=0.9.2.7.1"></script>
</head>

<body>
    <section data-replaced="main">
        <header>
            <nav id="logos">
                <h1 hidden class="accent" data-color="lime">lim<i><img src="/static/icons/icon.svg" alt="svg"></i></h1>
                <h1 hidden class="accent" data-color="blueberry">blueb<i><img src="/static/icons/blueberries.svg"
                            alt="svg"></i>rry</h1>
                <h1 hidden class="accent" data-color="grape">gr<i><img src="/static/icons/grape.svg" alt="svg"></i>pe
                </h1>
                <h1 hidden class="accent" data-color="tomato">t<i><img src="/static/icons/tomato.svg" alt="svg"></i>mato
                </h1>
                <h1 hidden class="accent" data-color="carrot">carro<i><img src="/static/icons/carrot.svg" alt="svg"></i>
                </h1>
                <h1 hidden class="accent" data-color="lemon">lem<i><img src="/static/icons/lemon.svg" alt="svg"></i>n
                </h1>
                <menu>
                    <h6><span id="nat-type">NAT</span></h6>
                    <h6><span id="version">1.0.0</span></h6>
                    <button data-replaced="profile swipe-left"><span class="iconoir-settings"></span></button>
                </menu>
            </nav>
            <div>
                <h2 class="accent">Анонимный мессенджер</h2>
                <!--<button id="install-app" class="iconoir-download-square">Установить приложение</button>-->
            </div>
        </header>
        <form id="chat-form">
            <nav>
                <input type="text" placeholder="Введите ID чата" id="chat-id">
                <button type="button" class="iconoir-nav-arrow-right" id="open-chat"></button>
            </nav>
            <!--<button type="button" data-replaced="contacts swipe-down" data-line="down">Контакты</button>-->
        </form>
    </section>
    <section data-replaced="profile" hidden>
        <nav>
            <button data-replaced="main swipe-right" data-line="left">Назад</button>
            <div>
                <section>
                    <header>
                        <nav>
                            <h4 data-storage="username"></h4>
                            <button menu="edit-profile"><span class="iconoir-edit-pencil"></span></button>
                        </nav>
                    </header>
                    <main>
                        <h3 data-storage="kaomoji"></h3>
                    </main>
                    <footer></footer>
                </section>
                <nav>
                    <button class="iconoir-fill-color" data-hue-adaptive="0"></button>
                    <button class="iconoir-fill-color" data-hue-adaptive="60"></button>
                    <button class="iconoir-fill-color" data-hue-adaptive="120"></button>
                    <button class="iconoir-fill-color" data-hue-adaptive="180"></button>
                    <button class="iconoir-fill-color" data-hue-adaptive="220"></button>
                    <button class="iconoir-fill-color" data-hue-adaptive="260"></button>
                    <button class="iconoir-fill-color" data-hue-adaptive="320"></button>
                </nav>
            </div>
        </nav>
    </section>
    <section data-replaced="contacts" hidden>
        <form>
            <nav>
                <input type="text" placeholder="Поиск:" name="find-contacts">
                <button class="iconoir-plus"></button>
            </nav>
            <button type="button" data-replaced="main swipe-up" data-line="up">чат</button>
        </form>
        <section>
            <header></header>
            <main>
                <h3>Контакты пока в разработке</h3>
            </main>
            <footer></footer>
        </section>
    </section>


    <footer id="custom">
        <a href="https://github.com/life-message/chat" class="iconoir-github">Github</a>
        <a href="https://iconoir.com/" class="iconoir-peace-hand">iconoir</a>
    </footer>
</body>
